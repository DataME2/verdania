# AWS Amplify Hosting build for the website in web/ (monorepo: set AMPLIFY_MONOREPO_APP_ROOT=web in the app).
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Amplify passes environment variables to the build only. Server-side code (SSR, API routes,
            # middleware) reads them at runtime from .env.production, so copy the ones it needs there.
            - env | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SITE_URL|SIM_URL|SIM_API_KEY)=' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*
