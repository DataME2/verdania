# AWS Amplify Hosting build for the website in web/ (monorepo: set AMPLIFY_MONOREPO_APP_ROOT=web in the app).
# Also set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY (random, 32 bytes, base64) in the app's environment variables:
# Next salts server-action ids with it, so a fixed key keeps them stable across deploys and pages left open
# during a deploy can still submit their forms. Next reads it at build time; nothing below needs to copy it.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Amplify passes environment variables to the build only. Server-side code (SSR, API routes,
            # middleware) reads them at runtime from .env.production, so copy the ones it needs there,
            # and stop with a clear message if one is missing (set them in Amplify > Hosting > Environment variables).
            - |
              for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SITE_URL SIM_URL SIM_API_KEY; do
                if [ -z "${!v}" ]; then echo "Missing environment variable: $v"; exit 1; fi
                echo "$v=${!v}" >> .env.production
              done
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*
