[project]
name = "verdania-sim"
version = "0.1.0"
description = "Verdania economic simulation engine (fictional country, synthetic data)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdania_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
